# Blueprint de Render: un servicio web (API + WebSocket + cliente) y PostgreSQL.
# Render → New → Blueprint → selecciona este repositorio.
services:
  - type: web
    name: cybergrid
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: cybergrid-db
          property: connectionString
      # Endpoints de evaluación activos en producción, protegidos por clave.
      - key: ENABLE_TEST_ENDPOINTS
        value: 'true'
      - key: TEST_API_KEY
        generateValue: true
      - key: MATCH_DURATION_S
        value: '180'
      - key: LOG_LEVEL
        value: info

databases:
  - name: cybergrid-db
    plan: free
    region: oregon
    databaseName: cybergrid
    user: cybergrid
